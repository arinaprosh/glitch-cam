<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Death Proof Glitch Cam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
    video { display: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; }
    
    #controls {
      position: fixed; bottom: 30px; left: 0; right: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; gap: 15px;
    }
    #pick-btn {
      padding: 12px 22px; background: rgba(0, 0, 0, 0.75); color: #fff;
      border: 2px solid #8a2be2; border-radius: 24px; font-size: 14px; font-weight: bold;
    }
    #record-btn {
      width: 74px; height: 74px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3); border: 4px solid #fff;
      display: flex; align-items: center; justify-content: center;
    }
    #record-btn::after {
      content: ''; width: 54px; height: 54px; border-radius: 50%;
      background: #ff2a55; transition: 0.2s;
    }
    #record-btn.recording::after { width: 28px; height: 28px; border-radius: 6px; }
    
    #aim {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; border: 2px solid #ff2a55;
      border-radius: 50%; z-index: 30; pointer-events: none;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="aim"></div>

  <div id="controls">
    <button id="pick-btn">1. Наведи кружок на красные буквы и нажми</button>
    <button id="record-btn"></button>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const pickBtn = document.getElementById('pick-btn');
    const recordBtn = document.getElementById('record-btn');
    const aim = document.getElementById('aim');

    let targetColor = null;
    let mediaRecorder, chunks = [], isRecording = false;

    // Включаем заднюю камеру
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(loop);
      })
      .catch(err => alert('Разрешите доступ к камере: ' + err));

    // Запоминаем цвет красных букв из центра прицела
    pickBtn.addEventListener('click', () => {
      const w = canvas.width, h = canvas.height;
      if (!w) return;
      const p = ctx.getImageData(Math.floor(w / 2), Math.floor(h / 2), 1, 1).data;
      targetColor = { r: p[0], g: p[1], b: p[2] };
      pickBtn.textContent = 'Буквы запомнены! (Нажми, если сменилось освещение)';
      pickBtn.style.borderColor = '#00ff88';
      aim.style.display = 'none';
    });

    // Проверяем, есть ли в кадре красные буквы + черная ткань рядом
    function checkCapInFrame(w, h) {
      if (!targetColor) return false;
      const stepX = Math.floor(w / 12);
      const stepY = Math.floor(h / 12);
      let redMatches = 0;
      let darkMatches = 0;

      for (let x = stepX * 2; x < stepX * 10; x += stepX) {
        for (let y = stepY * 2; y < stepY * 10; y += stepY) {
          const p = ctx.getImageData(x, y, 1, 1).data;
          const r = p[0], g = p[1], b = p[2];

          // Проверяем совпадение с красными буквами
          const diff = Math.abs(r - targetColor.r) + Math.abs(g - targetColor.g) + Math.abs(b - targetColor.b);
          if (diff < 75) redMatches++;

          // Проверяем наличие черной ткани кепки рядом
          if (r < 65 && g < 65 && b < 65) darkMatches++;
        }
      }
      // Срабатывает, если видны и буквы, и черная кепка
      return redMatches >= 2 && darkMatches >= 6;
    }

    function loop() {
      if (video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        const w = canvas.width, h = canvas.height;

        // Рисуем чистый кадр
        ctx.filter = 'none';
        ctx.drawImage(video, 0, 0, w, h);

        if (checkCapInFrame(w, h)) {
          // Фиолетовый глитч при виде кепки
          ctx.filter = 'hue-rotate(255deg) saturate(350%) contrast(160%)';
          const sx = (Math.random() - 0.5) * 18;
          const sy = (Math.random() - 0.5) * 18;
          ctx.drawImage(video, sx - 10, sy - 10, w + 20, h + 20);

          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 0.6;
          ctx.filter = 'hue-rotate(290deg) saturate(400%)';
          ctx.drawImage(video, sx + 18, sy, w, h);
          ctx.globalAlpha = 1.0;
          ctx.globalCompositeOperation = 'source-over';

          for (let i = 0; i < 10; i++) {
            if (Math.random() > 0.3) {
              const sliceY = Math.random() * h;
              const sliceH = Math.random() * (h * 0.08) + 5;
              const offsetX = (Math.random() - 0.5) * 80;
              ctx.drawImage(canvas, 0, sliceY, w, sliceH, offsetX, sliceY, w, sliceH);
            }
          }
          ctx.fillStyle = `rgba(140, 0, 255, ${Math.random() * 0.25})`;
          ctx.fillRect(0, 0, w, h);
        }
      }
      requestAnimationFrame(loop);
    }

    // Запись видео в галерею
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        chunks = [];
        const stream = canvas.captureStream(30);
        const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: mime });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `death-proof-${Date.now()}.${mime.includes('mp4') ? 'mp4' : 'webm'}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
      }
    });
  </script>
</body>
</html>
