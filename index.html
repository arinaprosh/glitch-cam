<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Purple Glitch Cam</title>
  
  <!-- Рабочие в РФ зеркала библиотек -->
  <script src="https://cloudflare.com"></script>
  <script src="https://esm.sh"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }

    #start-screen {
      position: fixed; inset: 0; z-index: 100;
      background: #111; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #start-btn {
      padding: 16px 32px; font-size: 18px; font-weight: bold;
      color: #fff; background: #555; border: none; border-radius: 12px;
      cursor: not-allowed; margin-top: 20px; transition: background 0.3s;
    }
    #start-btn.ready {
      background: #8a2be2; cursor: pointer;
    }
    #status-text { margin-top: 15px; font-size: 14px; color: #ff5577; max-width: 300px; }

    .a-enter-vr, .a-loader-title { display: none !important; }
    a-scene { position: fixed; inset: 0; z-index: 1; opacity: 0.01; pointer-events: none; }

    #output-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 10; background: #000;
    }

    #record-btn {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3); border: 4px solid #fff;
      z-index: 50; cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    #record-btn::after {
      content: ''; display: block; width: 56px; height: 56px; border-radius: 50%;
      background: #ff2a55; transition: all 0.2s ease;
    }
    #record-btn.recording::after { width: 28px; height: 28px; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="start-screen">
    <h2>Glitch Cam</h2>
    <p style="color: #aaa; margin-top: 8px; font-size: 14px;">Подготовка распознавания кепки</p>
    <button id="start-btn" disabled>Загрузка движка...</button>
    <div id="status-text"></div>
  </div>

  <canvas id="output-canvas"></canvas>
  <button id="record-btn"></button>

  <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
  </a-scene>

  <script>
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');
    const sceneEl = document.getElementById('ar-scene');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('record-btn');
    const target = document.querySelector('#cap-target');

    let isGlitching = false;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let arStarted = false;

    let checkAttempts = 0;
    const readyCheck = setInterval(() => {
      checkAttempts++;
      if (sceneEl.hasLoaded && sceneEl.systems && sceneEl.systems['mindar-image-system']) {
        clearInterval(readyCheck);
        startBtn.disabled = false;
        startBtn.classList.add('ready');
        startBtn.textContent = 'Включить камеру';
      } else if (checkAttempts > 20) {
        clearInterval(readyCheck);
        statusText.textContent = 'Ошибка загрузки библиотек. Попробуйте включить VPN при открытии ссылки.';
      }
    }, 500);

    startBtn.addEventListener('click', async () => {
      startBtn.textContent = 'Запуск камеры...';
      statusText.textContent = '';

      try {
        await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const arSystem = sceneEl.systems['mindar-image-system'];
        arSystem.start();

        setTimeout(() => {
          startScreen.style.display = 'none';
          recordBtn.style.display = 'flex';
          arStarted = true;
          renderLoop();
        }, 1200);

      } catch (err) {
        startBtn.textContent = 'Включить камеру';
        statusText.textContent = 'Ошибка камеры или файла targets.mind: ' + err.message;
      }
    });

    target.addEventListener("targetFound", () => { isGlitching = true; });
    target.addEventListener("targetLost", () => { isGlitching = false; });

    function renderLoop() {
      if (!arStarted) return;
      const video = document.querySelector('video');
      
      if (video && video.readyState >= 2 && video.videoWidth > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        const w = canvas.width;
        const h = canvas.height;

        ctx.save();
        if (isGlitching) {
          ctx.filter = 'hue-rotate(255deg) saturate(350%) contrast(160%)';
          const shakeX = (Math.random() - 0.5) * 16;
          const shakeY = (Math.random() - 0.5) * 16;
          ctx.drawImage(video, shakeX - 10, shakeY - 10, w + 20, h + 20);

          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 0.6;
          ctx.filter = 'hue-rotate(290deg) saturate(400%)';
          ctx.drawImage(video, shakeX + 18, shakeY, w, h);
          
          ctx.globalAlpha = 1.0;
          ctx.globalCompositeOperation = 'source-over';
          ctx.filter = 'hue-rotate(255deg) saturate(350%) contrast(160%)';

          for (let i = 0; i < 10; i++) {
            if (Math.random() > 0.3) {
              const sliceY = Math.random() * h;
              const sliceH = Math.random() * (h * 0.08) + 5;
              const offsetX = (Math.random() - 0.5) * 80;
              ctx.drawImage(canvas, 0, sliceY, w, sliceH, offsetX, sliceY, w, sliceH);
            }
          }

          ctx.fillStyle = `rgba(140, 0, 255, ${Math.random() * 0.25})`;
          ctx.fillRect(0, 0, w, h);
        } else {
          ctx.filter = 'none';
          ctx.drawImage(video, 0, 0, w, h);
        }
        ctx.restore();
      }
      requestAnimationFrame(renderLoop);
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      let mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `glitch-cap-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
    }
  </script>
</body>
</html>
