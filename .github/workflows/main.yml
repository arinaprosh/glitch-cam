name: Download AR Engine
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and copy MindAR and Three
        run: |
          npm install three@0.160.0 mind-ar@1.2.5
          cp node_modules/three/build/three.module.min.js three.module.js
          cp node_modules/mind-ar/dist/mindar-image-three.prod.js mindar.js
          rm -rf node_modules package.json package-lock.json
      - name: Save to repo
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add three.module.js mindar.js
          git commit -m "Add local AR files"
          git push
          
